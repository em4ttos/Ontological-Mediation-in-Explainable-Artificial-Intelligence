<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172033}.sub{font:20px Arial,sans-serif;fill:#273247}.small{font:16px Arial,sans-serif;fill:#273247}.num{font:700 26px Arial,sans-serif;fill:white}.card{stroke-width:2}.arrow{stroke:#6f7784;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.pill{font:17px Arial,sans-serif;fill:#273247}.cap{font:700 24px Arial,sans-serif;fill:#172033}
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#6f7784"/></marker>
  </defs>
  <rect width="1600" height="520" fill="#fff"/>
  <rect class="card" x="20" y="20" rx="24" width="360" height="370" fill="#eef7ff" stroke="#bad6ee"/>
  <rect class="card" x="420" y="20" rx="24" width="360" height="370" fill="#f1faf3" stroke="#bedfc5"/>
  <rect class="card" x="820" y="20" rx="24" width="360" height="370" fill="#fff8ee" stroke="#ead2ae"/>
  <rect class="card" x="1220" y="20" rx="24" width="360" height="370" fill="#f8f3ff" stroke="#d6c6ec"/>
  <circle cx="72" cy="68" r="30" fill="#6ca3c7"/><text class="num" x="64" y="77">1</text>
  <circle cx="472" cy="68" r="30" fill="#63a06d"/><text class="num" x="464" y="77">2</text>
  <circle cx="872" cy="68" r="30" fill="#d28b37"/><text class="num" x="864" y="77">3</text>
  <circle cx="1272" cy="68" r="30" fill="#8c6db4"/><text class="num" x="1264" y="77">4</text>
  <text class="title" x="200" y="60" text-anchor="middle"><tspan x="205">Concept-based</tspan><tspan x="205" dy="34">explanation</tspan></text>
  <text class="sub" x="200" y="132" text-anchor="middle">From model to concepts</text>
  <text class="title" x="600" y="70" text-anchor="middle">Ontological Unpacking</text>
  <text class="sub" x="600" y="112" text-anchor="middle"><tspan x="600">From concepts to</tspan><tspan x="600" dy="28">ontological commitments</tspan></text>
  <text class="title" x="1000" y="58" text-anchor="middle"><tspan x="1000">Ontological Mediation</tspan><tspan x="1000" dy="34">/ OMCR</tspan></text>
  <text class="sub" x="1000" y="132" text-anchor="middle"><tspan x="1000">From commitments to</tspan><tspan x="1000" dy="28">contextual and domain structures</tspan></text>
  <text class="title" x="1400" y="70" text-anchor="middle">Justificatory Assessment</text>
  <text class="sub" x="1400" y="112" text-anchor="middle"><tspan x="1400">From explanation to</tspan><tspan x="1400" dy="28">admissible (or non-admissible) claims</tspan></text>
  <path class="arrow" d="M382 206 H414" marker-end="url(#arr)"/><path class="arrow" d="M782 206 H814" marker-end="url(#arr)"/><path class="arrow" d="M1182 206 H1214" marker-end="url(#arr)"/>
  <g stroke="#26364a" stroke-width="3" fill="#dceaf2"><circle cx="85" cy="207" r="14"/><circle cx="85" cy="252" r="14"/><circle cx="85" cy="297" r="14"/><circle cx="145" cy="207" r="14"/><circle cx="145" cy="252" r="14"/><circle cx="145" cy="297" r="14"/><circle cx="205" cy="252" r="14"/><path d="M99 207L131 207M99 207L131 252M99 252L131 207M99 252L131 252M99 252L131 297M99 297L131 252M99 297L131 297M159 207L191 252M159 252L191 252M159 297L191 252" fill="none"/></g>
  <path class="arrow" d="M235 252 H274" marker-end="url(#arr)"/>
  <rect x="288" y="170" width="70" height="165" rx="10" fill="#fff" stroke="#8aa6bb" stroke-width="2"/><text class="sub" x="323" y="215" text-anchor="middle">C₁</text><text class="sub" x="323" y="250" text-anchor="middle">C₂</text><text class="sub" x="323" y="285" text-anchor="middle">C₃</text><text class="sub" x="323" y="320" text-anchor="middle">…</text>
  <rect x="450" y="180" width="72" height="150" rx="10" fill="#fff" stroke="#7fa68a" stroke-width="2"/><text class="sub" x="486" y="220" text-anchor="middle">C₁</text><text class="sub" x="486" y="255" text-anchor="middle">C₂</text><text class="sub" x="486" y="290" text-anchor="middle">C₃</text><path class="arrow" d="M540 255 H575" marker-end="url(#arr)"/>
  <rect x="610" y="172" width="120" height="42" rx="10" fill="#e5f1df" stroke="#8eb58f"/><text class="pill" x="670" y="199" text-anchor="middle">Entity</text>
  <rect x="570" y="250" width="105" height="42" rx="10" fill="#fff2d7" stroke="#c9a05d"/><text class="pill" x="622" y="277" text-anchor="middle">Property</text>
  <rect x="685" y="250" width="80" height="42" rx="10" fill="#e6f1ff" stroke="#7fa9cf"/><text class="pill" x="725" y="277" text-anchor="middle">Relation</text>
  <path d="M670 214 Q670 230 625 250M670 214 Q670 230 725 250" stroke="#4f5f70" stroke-width="2" fill="none"/>
  <g stroke="#52606e" stroke-width="2"><circle cx="875" cy="248" r="15" fill="#f2dca7"/><circle cx="915" cy="208" r="15" fill="#cfe3c9"/><circle cx="955" cy="248" r="15" fill="#c7dced"/><circle cx="915" cy="288" r="15" fill="#cfe3c9"/><path d="M887 237L903 220M927 220L943 237M943 259L927 276M903 276L887 259"/></g>
  <path d="M985 180 q-22 0-22 22 v112 q0 22 22 22" stroke="#4d5968" stroke-width="4" fill="none"/>
  <rect x="1000" y="172" width="150" height="40" rx="8" fill="#fde7e3" stroke="#cf8d84"/><text class="pill" x="1075" y="197" text-anchor="middle">Domain knowledge</text>
  <rect x="1000" y="218" width="150" height="40" rx="8" fill="#e6efff" stroke="#8ca9d4"/><text class="pill" x="1075" y="243" text-anchor="middle">Empirical configuration</text>
  <rect x="1000" y="264" width="150" height="40" rx="8" fill="#e5f3e8" stroke="#91b89a"/><text class="pill" x="1075" y="289" text-anchor="middle">Contextual conditions</text>
  <rect x="1000" y="310" width="150" height="40" rx="8" fill="#eee7f8" stroke="#9d8ab8"/><text class="pill" x="1075" y="335" text-anchor="middle">Normative constraints</text>
  <rect x="1255" y="180" width="105" height="155" rx="12" fill="#fff" stroke="#8d8499" stroke-width="2"/><text class="title" x="1307" y="220" text-anchor="middle" font-size="22">OMCR</text><line x1="1278" y1="246" x2="1337" y2="246" stroke="#6d6576" stroke-width="3"/><line x1="1278" y1="270" x2="1325" y2="270" stroke="#6d6576" stroke-width="3"/>
  <path class="arrow" d="M1370 255 H1402" marker-end="url(#arr)"/>
  <rect x="1418" y="170" width="135" height="48" rx="10" fill="#e5f5e8" stroke="#79b885"/><text class="pill" x="1485" y="200" text-anchor="middle">✓ Admissible</text>
  <rect x="1418" y="228" width="135" height="58" rx="10" fill="#fff2d7" stroke="#d2a85b"/><text class="pill" x="1485" y="253" text-anchor="middle"><tspan x="1485">? Epistemically</tspan><tspan x="1485" dy="20">Unstable</tspan></text>
  <rect x="1418" y="296" width="135" height="48" rx="10" fill="#fde7e3" stroke="#cc807a"/><text class="pill" x="1485" y="326" text-anchor="middle">× Inadmissible</text>
  <rect x="20" y="405" rx="16" width="360" height="82" fill="#f1f7fb"/><text class="small" x="200" y="435" text-anchor="middle"><tspan x="200">Reconstructs or renders explicit the model structures,</tspan><tspan x="200" dy="22">concepts, or relations relevant to a prediction.</tspan></text>
  <rect x="420" y="405" rx="16" width="360" height="82" fill="#f1f8f2"/><text class="small" x="600" y="435" text-anchor="middle"><tspan x="600">Clarifies the ontological commitments presupposed</tspan><tspan x="600" dy="22">by the explanatory content.</tspan></text>
  <rect x="820" y="405" rx="16" width="360" height="82" fill="#fff7e9"/><text class="small" x="1000" y="426" text-anchor="middle"><tspan x="1000">Relates reconstructed concepts and commitments to domain,</tspan><tspan x="1000" dy="20">contextual, and epistemic-normative constraints, with OMCRs</tspan><tspan x="1000" dy="20">functioning as mediated explanatory artifacts.</tspan></text>
  <rect x="1220" y="405" rx="16" width="360" height="82" fill="#f8f4fc"/><text class="small" x="1400" y="435" text-anchor="middle"><tspan x="1400">Evaluates whether explanatory claims are admissible</tspan><tspan x="1400" dy="22">within a specified epistemic and normative context.</tspan></text>
  <text class="cap" x="800" y="515" text-anchor="middle">From explanation to justification</text>
</svg>